<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Example</title>
    <style>
      .nav-container {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin: 40px 0 20px;
      }
      .nav-btn {
        display: inline-block;
        padding: 12px 22px;
        background: #0f172a;
        color: #fff;
        text-decoration: none;
        border-radius: 10px;
        transition: background 0.2s ease;
      }
      .nav-btn:hover {
        background: #1e293b;
      }
    </style>
</head>

<body>

    <h1>Student Table</h1>

    <table border="1">

        <caption>Student Information</caption>

        <thead>
            <tr>
                <th>Name</th>
                <th>Roll No</th>
                <th>Branch</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Samruddhi</td>
                <td>101</td>
                <td>CSE</td>
            </tr>

            <tr>
                <td>Rahul</td>
                <td>102</td>
                <td>IT</td>
            </tr>

            <tr>
                <td>Priya</td>
                <td>103</td>
                <td>ENTC</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">Total Students: 3</td>
            </tr>
        </tfoot>

    </table>

    <div class="nav-container">
      <a href="assignment_6.html" class="nav-btn">Previous</a>
      <a href="assignment_8.html" class="nav-btn">Next</a>
    </div>
</body>
</html>
