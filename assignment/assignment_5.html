<!DOCTYPE html>
<html>
<head>
    <title>3 Iframe Boxes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .box {
            width: 350px;
            height: 300px;
            border: 2px solid black;
            background-color: white;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
    <style>
      .nav-container {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin: 40px 0 20px;
      }
      .nav-btn {
        display: inline-block;
        padding: 12px 22px;
        background: #0f172a;
        color: #fff;
        text-decoration: none;
        border-radius: 10px;
        transition: background 0.2s ease;
      }
      .nav-btn:hover {
        background: #1e293b;
      }
    </style>
</head>
<body>

    <h2>Three Website Boxes Using Iframe</h2>

    <div class="container">
        
        <div class="box">
            <iframe src="https://www.wikipedia.org"></iframe>
        </div>

        <div class="box">
            <iframe src="https://www.amazon.in"></iframe>
        </div>

        <div class="box">
            <iframe src="https://en.wikipedia.org/wiki/Shivaji"></iframe>
        </div>

    </div>

    <div class="nav-container">
      <a href="assignment_4.html" class="nav-btn">Previous</a>
      <a href="assignment_6.html" class="nav-btn">Next</a>
    </div>

</body>
</html>
